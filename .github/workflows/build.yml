name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/gradle-build-action@v3
      - name: Build APK
        run: |
          chmod +x gradlew || true
          mkdir -p gradle/wrapper
          echo "distributionUrl=https\://services.gradle.org/distributions/gradle-8.0-bin.zip" > gradle/wrapper/gradle-wrapper.properties
          gradle wrapper --gradle-version 8.0 || true
          ./gradlew assembleDebug || gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: World-Shield-Cyber-APK
          path: app/build/outputs/apk/debug/*.apk
