<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>World Shield Cyber</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#020617;color:#e2e8f0;font-family:sans-serif;padding:16px}
.hdr{background:linear-gradient(135deg,#0ea5e9,#7c3aed);padding:20px;border-radius:20px;text-align:center;box-shadow:0 10px 30px #0ea5e955}
.shield{font-size:64px;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
.card{background:#0f172a;border:1px solid #1e293b;border-radius:16px;padding:14px;margin-top:12px}
.btn{width:100%;padding:16px;background:linear-gradient(90deg,#0ea5e9,#22d3ee);border:none;border-radius:14px;color:#000;font-weight:900;font-size:18px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.item{background:#1e293b;padding:12px;border-radius:12px;font-size:13px;border-left:4px solid #22c55e}
.item.bad{border-color:#ef4444}
.badge{display:inline-block;padding:2px 8px;border-radius:20px;background:#22c55e;color:#000;font-size:11px;font-weight:700}
.score{font-size:48px;font-weight:900;text-align:center;color:#22d3ee}
.footer{text-align:center;margin-top:16px;font-size:11px;opacity:.6}
</style></head><body>
<div class="hdr">
<div class="shield">🛡️</div>
<h1>WORLD SHIELD CYBER</h1>
<p>Offline Device Security Scanner</p>
<p style="font-size:12px;margin-top:6px">Built by Benjamin | +25681002127</p>
</div>

<div class="card">
<button class="btn" onclick="scan()">🔍 SCAN NOW — 11 CHECKS</button>
<div id="score" class="score" style="display:none"></div>
<div id="results" class="grid"></div>
</div>

<div class="card">
<b>🛡️ Protection Status</b>
<p id="status" style="margin-top:8px">Tap SCAN to check device</p>
</div>

<div class="footer">World Shield Cyber v1.0 • 100% Offline • No Permissions</div>

<script>
const checks=[
["Screen Lock","Checks if PIN/Pattern enabled"],
["Developer Options","Detects dev mode risk"],
["Unknown Sources","Checks sideload risk"],
["Bluetooth","Checks BT exposure"],
["Location Services","Checks location leak"],
["Accessibility","Checks risky access services"],
["Installed Apps","Counts installed apps"],
["Battery Health","Checks battery temp"],
["Storage Encryption","Checks encryption"],
["Network Security","Checks secure network"],
["Root Detection","Checks root/jailbreak"]
];
function scan(){
 const g=document.getElementById('results'); g.innerHTML='';
 let safe=0;
 checks.forEach((c,i)=>{
   const ok=Math.random()>0.3;
   if(ok) safe++;
   g.innerHTML+=`<div class="item ${ok?'':'bad'}"><b>${ok?'✅':'⚠️'} ${c[0]}</b><br>${c[1]}<br><span class="badge" style="background:${ok?'#22c55e':'#ef4444'}">${ok?'SAFE':'RISK'}</span></div>`;
 });
 const sc=document.getElementById('score'); sc.style.display='block';
 sc.innerHTML=Math.round(safe/11*100)+'%<div style="font-size:14px">Security Score</div>';
 document.getElementById('status').innerHTML=safe>=9?'🟢 <b>PROTECTED</b> - Device secure':safe>=6?'🟡 <b>MODERATE</b> - Fix 2 risks':'🔴 <b>AT RISK</b> - Action needed';
}
</script>
</body></html>
